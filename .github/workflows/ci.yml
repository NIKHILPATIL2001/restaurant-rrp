name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rrp
          POSTGRES_PASSWORD: rrp
          POSTGRES_DB: rrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,dashboard]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://rrp:rrp@localhost:5432/rrp
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://rrp:rrp@localhost:5432/rrp
          RRP_MODELS_DIR: /tmp/rrp_models
          RRP_DATA_DIR: ./data
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and boot
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz && break
            sleep 5
          done

      - name: Run smoke test
        run: bash scripts/smoke.sh

      - name: Tear down
        if: always()
        run: docker compose down -v
