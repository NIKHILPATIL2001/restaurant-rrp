[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restaurant-rrp"
version = "0.1.0"
description = "Self-learning restaurant resource planning forecaster"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "lightgbm>=4.3.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "apscheduler>=3.10.4",
    "structlog>=24.2.0",
    "holidays>=0.46",
    "pyarrow>=16.1.0",
    "pyyaml>=6.0.1",
    "joblib>=1.4.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35.0",
    "altair>=5.3.0",
    "watchdog>=4.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.103.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "types-pyyaml>=6.0.12",
    "types-psycopg2>=2.9.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rrp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TID"]
ignore = [
    "E501",    # line too long — handled by formatter
    "B008",    # FastAPI Depends() in default arg — standard pattern
    "N806",    # uppercase variable (X_train, X_val) — ML convention
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/", "scripts/", "dashboard/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/rrp --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/rrp"]
omit = ["src/rrp/data/generator.py"]
